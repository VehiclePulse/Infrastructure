services:
  rabbitmq-1:
    image: rabbitmq:4-management
    hostname: rabbitmq-1
    container_name: rabbitmq-1
    restart: unless-stopped
    environment:
      RABBITMQ_NODENAME: rabbit@rabbitmq-1
      RABBITMQ_ERLANG_COOKIE: vehiclepulse_cluster_secret_2026
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin_password
    volumes:
      - rabbitmq1_data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./definitions.json:/etc/rabbitmq/definitions.json:ro
    networks:
      - vehicle-pulse-network

  rabbitmq-2:
    image: rabbitmq:4-management
    hostname: rabbitmq-2
    container_name: rabbitmq-2
    restart: unless-stopped
    environment:
      RABBITMQ_NODENAME: rabbit@rabbitmq-2
      RABBITMQ_ERLANG_COOKIE: vehiclepulse_cluster_secret_2026
    volumes:
      - rabbitmq2_data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./definitions.json:/etc/rabbitmq/definitions.json:ro
    networks:
      - vehicle-pulse-network

  rabbitmq-3:
    image: rabbitmq:4-management
    hostname: rabbitmq-3
    container_name: rabbitmq-3
    restart: unless-stopped
    environment:
      RABBITMQ_NODENAME: rabbit@rabbitmq-3
      RABBITMQ_ERLANG_COOKIE: vehiclepulse_cluster_secret_2026
    volumes:
      - rabbitmq3_data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./definitions.json:/etc/rabbitmq/definitions.json:ro
    networks:
      - vehicle-pulse-network

  haproxy:
    image: haproxy:3.2-alpine
    container_name: rabbitmq-haproxy
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - vehicle-pulse-network
    depends_on:
      - rabbitmq-1
      - rabbitmq-2
      - rabbitmq-3

volumes:
  rabbitmq1_data:
  rabbitmq2_data:
  rabbitmq3_data:

networks:
  vehicle-pulse-network:
    external: true