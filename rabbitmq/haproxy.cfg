global
    log stdout format raw local0

defaults
    log global
    timeout connect 5s
    timeout client 1h
    timeout server 1h
    timeout check 5s

frontend amqp_frontend
    mode tcp
    bind *:5672
    default_backend rabbitmq_amqp

backend rabbitmq_amqp
    mode tcp
    balance roundrobin
    option tcp-check
    server rabbitmq-1 rabbitmq-1:5672 check inter 2s fall 3 rise 2
    server rabbitmq-2 rabbitmq-2:5672 check inter 2s fall 3 rise 2
    server rabbitmq-3 rabbitmq-3:5672 check inter 2s fall 3 rise 2

frontend management_frontend
    mode http
    bind *:15672
    default_backend rabbitmq_management

backend rabbitmq_management
    mode http
    balance roundrobin
    option httpchk GET /
    server rabbitmq-1 rabbitmq-1:15672 check inter 2s fall 3 rise 2
    server rabbitmq-2 rabbitmq-2:15672 check inter 2s fall 3 rise 2
    server rabbitmq-3 rabbitmq-3:15672 check inter 2s fall 3 rise 2
